<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kishu & Joy Dosti Meter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        
        /* Header and Photo */
        .header {
            margin-bottom: 20px;
        }
        .header h1 {
            color: #1e3c72;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .header p {
            color: #777;
            font-size: 0.95rem;
        }
        .photo-container {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 15px;
            border: 4px solid #1e3c72;
        }
        .photo-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Names Label */
        .names-label {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1rem;
        }
        .names-label span {
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
        }
        .kishu { background-color: #3b82f6; } /* Blue for Kishu */
        .joy { background-color: #22c55e; } /* Green for Joy */

        /* Speedometer Styles */
        .gauge-section {
            margin: 25px 0 15px;
            position: relative;
        }
        .gauge-container {
            position: relative;
            width: 240px;
            height: 120px;
            margin: 0 auto;
            overflow: hidden;
        }
        .gauge-body {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: conic-gradient(from 270deg, #3b82f6 0deg 60deg, #eab308 60deg 120deg, #ef4444 120deg 180deg);
            position: absolute;
            top: 0;
            left: 0;
        }
        .gauge-inner {
            width: 175px;
            height: 175px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 32.5px;
            left: 32.5px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 18px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        .gauge-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1e3c72;
        }
        .needle {
            width: 5px;
            height: 100px;
            background: #333;
            position: absolute;
            bottom: 0;
            left: 117.5px;
            transform-origin: bottom center;
            transform: rotate(-90deg); /* Range: -90deg to +90deg */
            transition: transform 1.8s cubic-bezier(0.19, 1, 0.22, 1);
            border-radius: 3px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
            z-index: 2;
        }
        .needle-pivot {
            width: 15px;
            height: 15px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            bottom: -7.5px;
            left: 112.5px;
            z-index: 3;
        }
        
        /* Status Box */
        .status-box {
            background-color: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-top: 10px;
        }
        .status-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .status-desc {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.4;
        }
        
        /* Action Button */
        button {
            width: 100%;
            padding: 14px;
            margin: 20px 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(30, 60, 114, 0.3);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.97);
        }

        /* Live Chat Section */
        .chat-section {
            margin-top: 15px;
            border-top: 2px dashed #e2e8f0;
            padding-top: 20px;
        }
        .chat-section h2 {
            font-size: 1.2rem;
            color: #1e3c72;
            margin-bottom: 12px;
        }
        .chat-frame {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Bhai Dosti Meter</h1>
        <p>The Ultimate Brotherhood Score</p>
        
        <div class="photo-container">
            <img src="image_3.png" alt="Kishu and Joy">
        </div>
        
        <div class="names-label">
            <span class="kishu">Kishu</span>
            <span>&</span>
            <span class="joy">Joy</span>
        </div>
    </div>
    
    <div class="gauge-section">
        <div class="gauge-container">
            <div class="gauge-body"></div>
            <div class="gauge-inner">
                <span class="gauge-value" id="scoreText">0%</span>
            </div>
            <div class="needle" id="needle"></div>
            <div class="needle-pivot"></div>
        </div>
    </div>
    
    <div class="status-box">
        <div class="status-title" id="statusTitle">Analyzing...</div>
        <div class="status-desc" id="statusDesc">Tap the button to scan recent chat vibes!</div>
    </div>
    
    <button onclick="updateMeter()">📡 Scan Brotherhood Frequency</button>

    <!-- Embedded Live Cbox Chat -->
    <div class="chat-section">
        <h2>💬 Live Brother Chat</h2>
        <div class="chat-frame">
            <iframe src="https://www5.cbox.ws/box/?boxid=965489&boxtag=bZqXi6" width="100%" height="400" allowtransparency="yes" allow="autoplay" frameborder="0" marginheight="0" marginwidth="0" scrolling="auto"></iframe>
        </div>
    </div>
</div>

<script>
    function updateMeter() {
        const score = Math.floor(Math.random() * 51) + 50;
        const degrees = -90 + (score / 100) * 180;
        
        document.getElementById('needle').style.transform = `rotate(${degrees}deg)`;
        document.getElementById('scoreText').innerText = score + "%";
        
        const title = document.getElementById('statusTitle');
        const desc = document.getElementById('statusDesc');
        
        if (score >= 90) {
            title.innerText = "🔥 Unstoppable Duo!";
            title.style.color = "#ef4444";
            desc.innerText = "Pure Jai-Veeru energy! You two are perfectly in sync. Non-stop banter, inside jokes, and unconditional support. Legendary status!";
        } else if (score >= 75) {
            title.innerText = "⚡ Solid Brotherhood";
            title.style.color = "#eab308";
            desc.innerText = "The bond is strong! You share a great connection with plenty of laughs and regular check-ins. Keep that awesome momentum going!";
        } else {
            title.innerText = "Convo Status: Stable";
            title.style.color = "#3b82f6";
            desc.innerText = "You're clearly tight, but maybe the chat's a bit quiet today? Drop a message in the chat box below to boost the score!";
        }
    }

    window.onload = updateMeter;
</script>

</body>
</html>
